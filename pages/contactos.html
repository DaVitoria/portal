<!DOCTYPE html>

<html lang="pt">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<link
    rel="stylesheet"
    href="../assets/css/login.css"
>

<title>Fazer Denúncia</title>


</head>

<body class="login-page">


<main class="login-container">


    <!-- TÍTULO -->

    <h1 class="login-title">
        Fazer Denúncia
    </h1>


    <!-- DESCRIÇÃO -->

    <p class="form-description">
        Utilize este formulário para denunciar uma situação
        de bullying ou racismo escolar.
    </p>


    <!-- FORMULÁRIO -->

    <form
        id="denuncia-form"
        novalidate
    >


        <div class="form-group">

            <label for="nome">
                Nome
            </label>

            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite o seu nome"
                autocomplete="name"
            >

        </div>



        <div class="form-group">

            <label for="contacto">
                Contacto
            </label>

            <input
                type="tel"
                id="contacto"
                name="contacto"
                placeholder="Digite o seu contacto"
                autocomplete="tel"
            >

        </div>




        <div class="form-group checkbox-group">

            <label>

                <input
                    type="checkbox"
                    id="anonimo"
                    name="anonimo"
                >

                Quero fazer esta denúncia de forma anónima.

            </label>

        </div>



        <div class="form-group">

            <label for="tipo">
                Tipo de ocorrência
            </label>

            <select
                id="tipo"
                name="tipo"
                required
            >

                <option value="">
                    Selecione uma opção
                </option>

                <option value="bullying">
                    Bullying
                </option>

                <option value="racismo">
                    Racismo
                </option>

                <option value="bullying-racismo">
                    Bullying relacionado com racismo
                </option>

                <option value="discriminacao">
                    Discriminação
                </option>

                <option value="agressao">
                    Agressão física
                </option>

                <option value="cyberbullying">
                    Cyberbullying
                </option>

                <option value="outro">
                    Outro
                </option>

            </select>

        </div>



        <div class="form-group">

            <label for="local">
                Onde aconteceu?
            </label>

            <input
                type="text"
                id="local"
                name="local"
                placeholder="Ex.: sala de aula, recreio..."
                required
            >

        </div>



        <div class="form-group">

            <label for="data">
                Data da ocorrência
            </label>

            <input
                type="date"
                id="data"
                name="data"
                required
            >

        </div>



        <div class="form-group">

            <label for="descricao">
                Descrição da ocorrência
            </label>

            <textarea
                id="descricao"
                name="descricao"
                placeholder="Descreva o que aconteceu..."
                required
            ></textarea>

        </div>



        <div class="form-group">

            <label for="envolvidos">
                Pessoas envolvidas
            </label>

            <textarea
                id="envolvidos"
                name="envolvidos"
                placeholder="Se souber, indique quem esteve envolvido..."
            ></textarea>

        </div>


        <div class="form-group">

            <label for="testemunhas">
                Testemunhas
            </label>

            <textarea
                id="testemunhas"
                name="testemunhas"
                placeholder="Indique possíveis testemunhas..."
            ></textarea>

        </div>


        <div
            class="form-errors"
            id="form-errors"
            role="alert"
            style="display: none;"
        >

            <p id="error-message"></p>

        </div>



        <div
            class="form-success"
            id="form-success"
            role="status"
            style="display: none;"
        >

            <p>
                Denúncia enviada com sucesso!
            </p>

        </div>



        <button
            type="submit"
            class="login-button"
        >
            Enviar Denúncia
        </button>


        <!-- VOLTAR -->

        <p class="switch-page">

            <a href="../index.html">
                ← Voltar para o início
            </a>

        </p>


    </form>

</main>


<!-- =====================================================
     JAVASCRIPT DA DENÚNCIA
====================================================== -->

<script src="../assets/js/denuncia.js"></script>

</body>

</html>
