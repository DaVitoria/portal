<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/login.css">
    <title>Cadastro</title>
</head>

<body class="signup-page">

    <main class="signup-container">

        <h1 class="signup-title">Formulário de Cadastro</h1>

        <form id="signup-form" novalidate>

            <!-- USUÁRIO -->
            <div class="form-group">
                <label for="username">Usuário</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Digite o seu usuário"
                    autocomplete="username"
                    required
                >
            </div>

            <!-- EMAIL -->
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite o seu email"
                    autocomplete="email"
                    required
                >
            </div>

            <!-- SENHA -->
            <div class="form-group">
                <label for="password">Senha</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Digite a sua senha"
                    autocomplete="new-password"
                    required
                    minlength="6"
                >
            </div>

            <!-- CONFIRMAR SENHA -->
            <div class="form-group">
                <label for="password-confirm">Confirme a senha</label>
                <input
                    type="password"
                    id="password-confirm"
                    name="password-confirm"
                    placeholder="Confirme a sua senha"
                    autocomplete="new-password"
                    required
                >
            </div>

            <!-- MENSAGEM DE ERRO (Escondida por padrão via CSS/JS) -->
            <div class="form-errors" id="form-errors" role="alert" style="display: none;">
                <p id="error-message">Verifique os dados introduzidos.</p>
            </div>

            <!-- BOTÃO SUBMIT -->
            <button type="submit" class="signup-button">
                Submeter
            </button>

            <!-- LINK PARA LOGIN -->
            <p class="switch-page">
                Já tem uma conta? <a href="./login.html">Faça login</a>
            </p>

        </form>

    </main>

    <script src="../assets/js/signup.js"></script>
</body>

</html>
